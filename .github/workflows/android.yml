name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Probe latest dependency versions
        run: ./tools/probe-versions.sh

      - name: Set up JDK 21
        if: hashFiles('gradlew') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK, release AAB, unit tests and lint
        if: hashFiles('gradlew') != ''
        run: ./gradlew --stacktrace assembleDebug bundleRelease testDebugUnitTest lintDebug

      - name: Upload debug APK
        if: hashFiles('gradlew') != ''
        uses: actions/upload-artifact@v4
        with:
          name: onefera-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB (unsigned unless signing secrets are configured)
        if: hashFiles('gradlew') != ''
        uses: actions/upload-artifact@v4
        with:
          name: onefera-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload lint report
        if: always() && hashFiles('gradlew') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: onefera-debug-apk
          path: app/build/outputs/apk/debug

      - name: Install Pillow for log thumbnails
        run: python3 -m pip install --quiet --break-system-packages pillow

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke test on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./tools/smoke-test.sh

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-screenshots/
          if-no-files-found: ignore
